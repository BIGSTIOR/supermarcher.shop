services:
  - type: web
    name: supermarche-shop
    env: php
    plan: free
    buildCommand: |
      composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader --no-dev
      npm ci
      npm run build
      php artisan config:cache
      php artisan route:cache
      php artisan view:cache
    startCommand: |
      php artisan migrate --force
      php artisan serve --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://supermarche-shop.onrender.com
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: supermarche-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: supermarche-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: supermarche-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: supermarche-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: supermarche-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: public

 databases:
  - name: supermarche-db
    databaseName: supermarche
    user: supermarche
    plan: free
