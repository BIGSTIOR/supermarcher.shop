name: Deploy Laravel app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, pdo, pdo_mysql, zip, gd, intl
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts --no-dev

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Run tests
        run: php artisan test

      - name: Prepare deployment artifact
        run: |
          mkdir -p .deploy
          rsync -a --delete --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='storage' --exclude='.env' ./ .deploy/
          cp .env.example .deploy/.env.production

      - name: Deploy via SSH
        uses: appleboy/scp-action@v0.1.10
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: '.deploy/*'
          target: '/var/www/supermarche'
          strip_components: 1
          overwrite: true

      - name: Run remote deployment commands
        uses: appleboy/ssh-action@v1.0.1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            cd /var/www/supermarche
            cp -n .env.production .env || true
            composer install --no-interaction --prefer-dist --no-progress --no-dev --optimize-autoloader
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan migrate --force
            chown -R www-data:www-data /var/www/supermarche
            chmod -R 775 storage bootstrap/cache
            sudo systemctl reload php8.3-fpm || sudo systemctl reload nginx
